name: DevSecOps Pipeline
on: [push]

jobs:
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Ejecutar escáner Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
