name: DevSecOps Pipeline
on: [push]

jobs:
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar SAST (Falla si hay vulnerabilidades)
        run: semgrep scan --config "p/default" --error

  sca_dependency_check:
    name: Análisis SCA (OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Descargar binario vulnerable (Cebo)
        run: wget https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/2.14.1/log4j-core-2.14.1.jar

      - name: Ejecutar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DVWA-Test'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7

      - name: Guardar Informe HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Informe-OWASP-SCA
          path: reports/dependency-check-report.html

  secret_scanning:
    name: Análisis de Secretos (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker_trivy:
    name: Build y Escaneo Docker (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t dvwa-test-image:latest .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dvwa-test-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
