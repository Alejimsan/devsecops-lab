name: DevSecOps Pipeline
on: [push]

jobs:
  sast_semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Ejecutar SAST (Falla si hay vulnerabilidades)
        run: semgrep scan --config "p/default" --error

  sca_dependency_check:
    name: Análisis SCA (OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Ejecutar OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DVWA-Test'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
